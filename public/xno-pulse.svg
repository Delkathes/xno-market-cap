    >
        <animate
            attribute-name="stroke-dashoffset"
            values="0;-50"
            dur="3.5s"
            repeat-count="indefinite"
        />
    </line>
    <line
        x1="162"
        y1="95"
        x2="203"
        y2="75"
        stroke="#3b82f6"
        stroke-width="1"
        stroke-dasharray="3 4"
        stroke-opacity="0.3"
    >
