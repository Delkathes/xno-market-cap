<svg viewBox="0 0 280 210" fill="none" className="w-full max-w-65" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="gn-bg-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
        </radialGradient>
        <filter id="gn-glow-filter" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur std-deviation="2.5" in="SourceGraphic" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <!-- {/* Ambient glow */} -->
    <ellipse cx="140" cy="105" rx="72" ry="62" fill="url(#gn-bg-grad)" />
    <!-- {/* Center pulse rings */} -->
    <circle cx="140" cy="105" r="24" fill="none" stroke="#06b6d4" stroke-width="1.5">
        <animate attribute-name="r" values="24;56" dur="3s" repeat-count="indefinite" />
        <animate
            attribute-name="stroke-opacity"
            values="0.55;0"
            dur="3s"
            repeat-count="indefinite"
        />
    </circle>
    <circle cx="140" cy="105" r="24" fill="none" stroke="#06b6d4" stroke-width="1">
        <animate
            attribute-name="r"
            values="24;56"
            dur="3s"
            begin="1.5s"
            repeat-count="indefinite"
        />
        <animate
            attribute-name="stroke-opacity"
            values="0.35;0"
            dur="3s"
            begin="1.5s"
            repeat-count="indefinite"
        />
    </circle>
    <!-- {/* Connection lines */} -->
